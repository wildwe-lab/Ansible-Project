- name: Configure test servers
  hosts: test
  become: yes

  tasks:
    - name: Install Nginx
      package:
        name: nginx
        state: present
    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: yes
    - name: Copy website to Nginx
      copy:
        src: index.html
        dest: /usr/share/nginx/html/index.html
